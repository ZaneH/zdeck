[package]
name = "zdeck-obs"
version = "0.1.0"
description = "Loopback OBS Studio WebSocket adapter for zDeck"
authors = ["Zane Helton"]
license = "MIT"
edition = "2021"
rust-version = "1.89"
workspace = "../../src-tauri"

[dependencies]
obws = "0.15"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-websockets = { version = "0.13", features = ["server"] }
