[package]
name = "zdeck-plugin-host"
version = "0.1.0"
description = "Trusted-local stdio plugin host and discovery for zDeck"
authors = ["Zane Helton"]
license = "MIT"
edition = "2021"
rust-version = "1.89"
workspace = "../../src-tauri"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
zdeck-schema = { path = "../zdeck-schema" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
