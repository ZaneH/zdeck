[package]
name = "zdeck-plugin-host"
version = "0.1.0"
description = "Trusted-local stdio plugin host and discovery for zDeck"
authors = ["Zane Helton"]
license = "MIT"
edition = "2021"
rust-version = "1.89"
workspace = "../../src-tauri"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
zdeck-schema = { path = "../zdeck-schema" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
