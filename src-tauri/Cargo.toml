[workspace]
members = ["../crates/zdeck-obs", "../crates/zdeck-schema", "../crates/zdeck-system", "../crates/zdeck-plugin-host"]
resolver = "2"

[package]
name = "zDeck"
version = "0.1.0"
description = "Deck local editor and phone preview"
authors = ["Zane Helton"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-smoke = ["dep:tempfile"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
embed-resource = "3"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Keep reviewed plugin versions; the locked Tauri core requires Rust 1.90.
tauri-plugin-dialog = "=2.7.0"
# Upgrade plugins deliberately, independently of the core MSRV correction.
tauri-plugin-opener = "=2.5.3"
tauri-plugin-deep-link = "=2.4.5"
tauri-plugin-single-instance = { version = "=2.3.6", features = ["deep-link"] }
zdeck-obs = { path = "../crates/zdeck-obs" }
zdeck-plugin-host = { path = "../crates/zdeck-plugin-host" }
zdeck-schema = { path = "../crates/zdeck-schema" }
zdeck-system = { path = "../crates/zdeck-system" }
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-websockets = { version = "0.13", features = ["server"] }
url = "2"
tempfile = { version = "3", optional = true }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-websockets = { version = "0.13", features = ["server", "client"] }
