name: System controls (cross-platform)
on:
  pull_request:
    branches: [dev, production]
  push:
    branches: [dev, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Standalone schema tests (no desktop dependencies)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p zdeck-schema
      - name: Standalone OBS fake-peer tests (no desktop dependencies)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p zdeck-obs
      - name: Standalone system adapter tests (no desktop dependencies or live controls)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p zdeck-system
      - name: Standalone plugin host tests (Node, no desktop dependencies or live plugins)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p zdeck-plugin-host
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=4 --testTimeout=20000
      - name: Native compile and fake-backed system/dispatcher tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --test desktop_actions --test remote_service
      - name: Diagnose Windows native loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/diagnose-windows-loader.ps1 -OutputDirectory "$env:RUNNER_TEMP/windows-loader"
      - name: Upload Windows loader evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-loader-evidence
          path: ${{ runner.temp }}/windows-loader
          if-no-files-found: warn
          retention-days: 7
      - name: macOS fake CoreAudio regression tests (no live controls)
        if: runner.os == 'macOS'
        run: bash scripts/test-system-macos.sh
      - name: Build development executable (no installer or release signing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npm run tauri:build -- --debug --no-bundle
      - name: Upload development executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zdeck-dev-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            src-tauri/target/debug/deck
            src-tauri/target/debug/deck.exe
          if-no-files-found: error
          retention-days: 7
