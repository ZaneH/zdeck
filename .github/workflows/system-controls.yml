name: System controls (cross-platform)
on:
  pull_request:
  push:
    branches: [main, fix/cross-platform-system-controls]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Native compile and fake-backed system/dispatcher tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --test system_actions --test desktop_actions --test remote_service
      - name: macOS fake CoreAudio regression tests (no live controls)
        if: runner.os == 'macOS'
        run: bash scripts/test-system-macos.sh
